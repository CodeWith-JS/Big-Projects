<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | GlassAuth</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <div class="background">

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>

    </div>


    <main class="glass-container">

        <div class="glass-card">

            <div class="logo">
                ◈
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="subtitle">
                Sign in to continue
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit">
                    Sign In
                </button>


                <p id="message"></p>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="register">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>

        </div>

    </main>


    <script src="./js/auth.js"></script>

</body>

</html>
